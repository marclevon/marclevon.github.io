<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mumkai | Official Site</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --accent-color: #cc0000;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
        }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            padding: 40px 0;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-color);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 3rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        header p {
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 5px 0 0 0;
        }
        section {
            margin-bottom: 50px;
        }
        h2 {
            font-size: 1.6rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        h4 {
            text-align: center;
            margin: 10px 0 0 0;
            text-transform: uppercase;
            font-size: 0.9rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 6px;
            padding: 15px;
            border: 1px solid var(--border-color);
        }
        .media-container {
            position: relative;
            background: #000000;
            border-radius: 4px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            width: 100%;
        }
        .media-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .social-ribbon {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 20px 0;
        }
        .social-ribbon a {
            color: var(--text-muted);
        }
        .social-ribbon a:hover {
            color: var(--accent-color);
        }
        .contact-form {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 6px;
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #000000;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 4px;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--accent-color);
            outline: none;
        }
        .submit-btn {
            background: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .submit-btn:hover {
            background: #ff0000;
        }
    </style>
</head>
<body>

    <!-- Full-Width Top Banner Artwork -->
    <div style="width: 100%; background: #000000; overflow: hidden; border-bottom: 2px solid var(--accent-color);">
        <img src="images/banner.jpg" alt="Mumkai Banner" style="width: 100%; max-height: 250px; object-fit: cover; display: block; margin: 0 auto;">

                <div class="card">
                    <div class="media-container">
