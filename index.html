<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mumkai | The Works of Marc Mumcian</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #110303;
            --accent-color: #990000; /* Deep Dark Red Theme */
            --accent-hover: #cc0000;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #240707;
        }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-main);
        }
        header {
            text-align: center;
            padding: 50px 0 30px 0;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 20px rgba(153, 0, 0, 0.3);
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 3rem;
            margin: 10px 0 5px 0;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        header p {
            color: var(--accent-color);
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 30px;
        }
        section {
            margin-bottom: 60px;
        }
        h2 {
            font-size: 1.6rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-main);
        }
        h4 {
            font-size: 0.95rem;
            color: var(--text-main);
            margin: 12px 0 0 0;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 6px;
            padding: 15px;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease-in-out;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
            box-shadow: 0 4px 20px rgba(153, 0, 0, 0.1);
        }
        .media-container {
            position: relative;
            background: #000000;
            border-radius: 4px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            width: 100%;
        }
        .media-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .media-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .btn {
            display: block;
            text-align: center;
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--accent-color);
            text-decoration: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 15px;
            transition: all 0.2s;
        }
        .btn:hover {
            background-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(153, 0, 0, 0.4);
        }
        .social-ribbon {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 20px 0;
        }
        .social-ribbon a {
            color: var(--text-muted);
            transition: color 0.2s, transform 0.2s;
        }
        .social-ribbon a:hover {
            color: var(--accent-color);
            transform: scale(1.1);
        }
        .contact-form {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 6px;
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #000000;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 4px;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--accent-color);
            outline: none;
        }
        .submit-btn {
            background: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .submit-btn:hover {
            background: var(--accent-hover);
        }
        footer {
            text-align: center;
            padding-top: 40px;
            margin-top: 60px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <!-- Full-Width Rectangular Top Banner Image Layout -->
    <div style="width: 100%; background: #000000; overflow: hidden; border-bottom: 2px solid var(--accent-color);">
        <img src="images/banner.jpg" alt="Mumkai Banner" style="width: 100%; max-height: 250px; object-fit: cover; display: block; margin: 0 auto;">
    </div>

    <div class="container">
        
        <header>
            <img src="images/profile.jpg" alt="Mumkai" class="profile-img">
            <h1>Mumkai</h1>
            <p>the works of marc mumcian</p>
        </header>

        <!-- Section 1: Music SoundCloud Audio Players -->
        <section id="music-portfolio">
            <h2>Music</h2>
            <div class="grid">
                <!-- Track 1: The Duke -->
                <div class="card">
                    <div class="media-container" style="aspect-ratio: auto; height: 300px;">
                        <iframe width="100%" height="300" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://soundcloud.com"></iframe>
                    </div>
                    <h4>The Duke</h4>
                </div>

                <!-- Track 2: Cloud Capers -->
                <div class="card">
                    <div class="media-container" style="aspect-ratio: auto; height: 300px;">
                        <iframe width="100%" height="300" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://soundcloud.com"></iframe>
                    </div>
                    <h4>Cloud Capers</h4>
                </div>

                <!-- Track 3: Hush -->
                <div class="card">
                    <div class="media-container" style="aspect-ratio: auto; height: 300px;">
                        <iframe width="100%" height="300" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://soundcloud.com"></iframe>
                    </div>
                    <h4>Hush</h4>
                </div>

                <!-- Track 4: Side Quest -->
                <div class="card">
                    <div class="media-container" style="aspect-ratio: auto; height: 300px;">
                        <iframe width="100%" height="300" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://soundcloud.com"></iframe>
                    </div>
                    <h4>Side Quest</h4>
                </div>
            </div>
        </section>
        <!-- Section 2: Video Portfolio Block (YouTube Embeds & Local MP4 Streams) -->
        <section id="videos">
            <h2>Videos</h2>
            <div class="grid">
                <!-- Video 1: Last Hope (YouTube) -->
                <div class="card">
                    <div class="media-container">
                        <iframe src="https://youtube.com" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    </div>
                    <h4>Last Hope</h4>
                </div>

                <!-- Video 2: John Candy/John Hughes (YouTube) -->
                <div class="card">
                    <div class="media-container">
                        <iframe src="https://youtube.com" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    </div>
                    <h4>John Candy/John Hughes</h4>
                </div>

                <!-- Video 3: HIMYM extra (YouTube) -->
                <div class="card">
                    <div class="media-container">
                        <iframe src="https://youtube.com" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    </div>
                    <h4>HIMYM extra</h4>
                </div>

                <!-- Video 4: EP 1 - Primo (Local MP4) -->
                <div class="card">
                    <div class="media-container">
                        <video controls playsinline preload="metadata" style="width: 100%; height: 100%; object-fit: cover; display: block;">
                            <source src="video/primo.mp4" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    </div>
                    <h4>EP 1 - Primo</h4>
                </div>

                <!-- Video 5: Sketch 1 (Local MP4) -->
                <div class="card">
                    <div class="media-container">
                        <video controls playsinline preload="metadata" style="width: 100%; height: 100%; object-fit: cover; display: block;">
                            <source src="video/sketch1.mp4" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    </div>
                    <h4>Sketch 1</h4>
                </div>
            </div>
        </section>
